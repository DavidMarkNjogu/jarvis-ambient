<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S. Aperture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/visualizer.css">
</head>
<body class="state-idle">
  <div class="aperture-container">
    <header class="telemetry-bar">
      <span class="system-id">J.A.R.V.I.S.</span>
      <span class="status-indicator" id="statusText">SYSTEM IDLE</span>
    </header>

    <main class="orb-stage" aria-label="Visual speech aperture">
      <div class="orb-wrapper" id="orbWrapper">
        <span class="ring r-outer"></span>
        <span class="ring r-mid"></span>
        <span class="ring r-inner"></span>
        <span class="ring core"></span>
      </div>
      <div class="sound-wave" id="soundWave" aria-hidden="true">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
        <span class="bar bar-4"></span>
        <span class="bar bar-5"></span>
      </div>
    </main>

    <section class="voice-modulation" aria-label="Voice Modulation Controls">
      <div class="modulation-header">
        <span class="modulation-tag">VOCAL MATRIX CONFIGURATION</span>
        <span class="modulation-status" id="voiceSyncStatus">SYNCHRONIZED</span>
      </div>

      <div class="modulation-grid">
        <div class="modulation-field">
          <label for="voiceSelect" class="field-label">VOICE ARCHETYPE</label>
          <div class="select-container">
            <select id="voiceSelect" class="hud-select" aria-label="Select voice"></select>
            <span class="select-arrow" aria-hidden="true"></span>
          </div>
        </div>

        <div class="modulation-field">
          <div class="field-header">
            <label for="speedRange" class="field-label">RATE MODULATION</label>
            <span class="speed-badge" id="speedBadge">1.10x</span>
          </div>
          <div class="slider-container">
            <input type="range" id="speedRange" class="hud-range" min="0.5" max="2.0" step="0.05" value="1.1" aria-label="Adjust voice rate">
          </div>
        </div>
      </div>
    </section>

    <section class="command-dock" aria-label="Command and Voice Input">
      <form id="commandForm" class="command-form" autocomplete="off">
        <button type="button" id="micBtn" class="hud-mic-btn" aria-label="Voice input">
          <span class="mic-dot" aria-hidden="true"></span>
          <span class="mic-label">VOX</span>
        </button>
        <div class="input-wrapper">
          <input type="text" id="commandInput" class="hud-input" placeholder="› Enter query or command..." aria-label="Command prompt">
        </div>
        <button type="submit" id="sendBtn" class="hud-send-btn" aria-label="Transmit command">TRANSMIT</button>
      </form>
    </section>

    <footer class="caption-dock">
      <div class="caption-label">STREAM TELEMETRY</div>
      <div class="caption-content" id="captionText">Awaiting command input...</div>
    </footer>
  </div>

  <script src="/visualizer.js"></script>
</body>
</html>
