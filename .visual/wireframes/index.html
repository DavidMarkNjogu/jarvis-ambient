<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis Audio Visualizer - Wireframe States</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b0e;
      --surface: #0d1419;
      --border: #1f3640;
      --ink: #cfe6ee;
      --dim: #6f8a95;
      --glow: #59c3e3;
      --core: #bdf0ff;
      --listening: #7fd69b;
      --thinking: #e3b54a;
      --font-display: "Archivo", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--glow);
      margin-bottom: 8px;
    }
    p.sub {
      color: var(--dim);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1080px;
    }
    .state-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      border-radius: 4px;
    }
    .state-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .orbbox {
      width: 160px;
      height: 160px;
      position: relative;
    }
    .orb-ring {
      position: absolute;
      border-radius: 50%;
    }
    /* IDLE */
    .idle .state-title { color: var(--dim); }
    .idle .r1 { inset: 0; border: 1px dashed var(--dim); opacity: 0.3; animation: spin 40s linear infinite; }
    .idle .r2 { inset: 16px; border: 1px solid var(--dim); opacity: 0.4; }
    .idle .core { inset: 50px; background: radial-gradient(circle, var(--dim) 0%, transparent 70%); opacity: 0.3; animation: breathe 4s ease-in-out infinite; }

    /* LISTENING */
    .listening .state-title { color: var(--listening); }
    .listening .r1 { inset: 0; border: 1px solid var(--listening); opacity: 0.6; animation: spin 20s linear infinite; }
    .listening .r2 { inset: 12px; border: 2px dashed var(--listening); opacity: 0.7; }
    .listening .core { inset: 45px; background: radial-gradient(circle, #a1f0b9 0%, var(--listening) 50%, transparent 75%); animation: pulse-mic 1s ease-in-out infinite; }

    /* THINKING */
    .thinking .state-title { color: var(--thinking); }
    .thinking .r1 { inset: 0; border: 1px dashed var(--thinking); opacity: 0.8; animation: spin 6s linear infinite; }
    .thinking .r2 { inset: 14px; border: 2px solid transparent; border-top-color: var(--thinking); border-bottom-color: var(--thinking); animation: spin 3s linear infinite reverse; }
    .thinking .core { inset: 52px; background: radial-gradient(circle, #ffe699 0%, var(--thinking) 60%, transparent 80%); animation: breathe 1.5s ease-in-out infinite; }

    /* SPEAKING */
    .speaking .state-title { color: var(--glow); }
    .speaking .r1 { inset: 0; border: 1px dashed var(--glow); opacity: 0.6; animation: spin 25s linear infinite; }
    .speaking .r2 { inset: 14px; border: 2px solid transparent; border-left-color: var(--glow); border-right-color: var(--glow); animation: spin 10s linear infinite reverse; }
    .speaking .core { inset: 40px; background: radial-gradient(circle, var(--core) 0%, var(--glow) 45%, rgba(89, 195, 227, 0.1) 70%); animation: voice-wave 0.7s ease-in-out infinite alternate; }

    .subtitle-preview {
      font-size: 0.75rem;
      color: var(--dim);
      text-align: center;
      line-height: 1.4;
      min-height: 2.8em;
      border-top: 1px solid var(--border);
      width: 100%;
      padding-top: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(0.92); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 0.8; } }
    @keyframes pulse-mic { 0%, 100% { transform: scale(0.88); opacity: 0.5; } 50% { transform: scale(1.12); opacity: 0.95; } }
    @keyframes voice-wave { 0% { transform: scale(0.85); box-shadow: 0 0 10px rgba(89,195,227,0.3); } 100% { transform: scale(1.18); box-shadow: 0 0 25px rgba(89,195,227,0.8); } }
  </style>
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S. Visualizer</h1>
    <p class="sub">Reactive Audio Aperture &amp; State Monitor Wireframes</p>
  </header>

  <div class="grid">
    <div class="state-card idle">
      <div class="state-title">System Idle</div>
      <div class="orbbox">
        <span class="orb-ring r1"></span>
        <span class="orb-ring r2"></span>
        <span class="orb-ring core"></span>
      </div>
      <div class="subtitle-preview">Awaiting wake signal...</div>
    </div>

    <div class="state-card listening">
      <div class="state-title">Listening</div>
      <div class="orbbox">
        <span class="orb-ring r1"></span>
        <span class="orb-ring r2"></span>
        <span class="orb-ring core"></span>
      </div>
      <div class="subtitle-preview">Mic input active (RMS reactive)</div>
    </div>

    <div class="state-card thinking">
      <div class="state-title">Processing</div>
      <div class="orbbox">
        <span class="orb-ring r1"></span>
        <span class="orb-ring r2"></span>
        <span class="orb-ring core"></span>
      </div>
      <div class="subtitle-preview">Synthesizing response...</div>
    </div>

    <div class="state-card speaking">
      <div class="state-title">Speaking</div>
      <div class="orbbox">
        <span class="orb-ring r1"></span>
        <span class="orb-ring r2"></span>
        <span class="orb-ring core"></span>
      </div>
      <div class="subtitle-preview">&ldquo;Good afternoon. All core systems are operational.&rdquo;</div>
    </div>
  </div>
</body>
</html>
